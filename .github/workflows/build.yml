name: Build StatusBarLayout Debug

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          brew install ldid

      - name: Build Rootless Debian package
        run: |
          export THEOS="$HOME/theos"

          echo "=== Available iPhoneOS SDKs ==="
          find "$THEOS/sdks" -maxdepth 1 -type d -name "iPhoneOS*.sdk" -print || true

          echo "=== Makefile ==="
          cat Makefile

          echo "=== Build ==="
          make clean
          make package FINALPACKAGE=1 ROOTLESS=1

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: StatusBarLayout-Debug-deb
          path: packages/*.deb
